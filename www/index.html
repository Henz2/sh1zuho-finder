<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>sh1zuho finder</title>
<style>
:root{--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#222;--card:#0b0b0b;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}html,body{min-height:100%;color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
#logo span{display:inline-block;animation:up .9s var(--ease) var(--d) backwards}
.sub{color:var(--mut);font-size:13px;margin:4px 0 18px;animation:up .9s var(--ease) .5s backwards}
.search{position:relative;margin-bottom:12px;animation:up .9s var(--ease) .6s backwards}
input{width:100%;padding:15px 44px 15px 16px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;font:inherit;outline:0;transition:border-color .3s,box-shadow .4s var(--ease)}
input:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
#clr{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;border-radius:12px;background:none;color:var(--mut);font-size:16px;transition:transform .25s var(--ease),color .2s}
#clr:active{transform:scale(.8);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:16px;animation:up .9s var(--ease) .7s backwards}
.tab,.btn{border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;transition:transform .25s var(--ease),background .3s,color .3s,border-color .3s}
.tab.on{background:#fff;color:#000;border-color:#fff}
.tab:active,.btn:active{transform:scale(.94)}
.btn{display:block;width:100%;margin-top:6px;padding:14px;border-radius:16px;color:var(--mut)}
ul{padding:0}
li{list-style:none;position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:var(--card);animation:up .6s var(--ease) calc(var(--i)*45ms) backwards;transition:transform .3s var(--ease),background .3s,border-color .3s}
li:active{transform:scale(.97);background:#151515;border-color:#555}
li.empty{justify-content:center;color:var(--mut);border-style:dashed}
.tx{min-width:0}
.tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
code{font:600 13px ui-monospace,Menlo,Consolas,monospace;padding:6px 10px;border:1px solid #333;border-radius:10px;white-space:nowrap}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.2);transform:scale(0);animation:rp .7s var(--ease) forwards;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,30px);opacity:0;background:#fff;color:#000;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;transition:transform .5s var(--ease),opacity .3s}
#toast.on{transform:translate(-50%,0);opacity:1}
body::before,body::after{content:'';position:fixed;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%);z-index:-1;pointer-events:none;animation:dr 22s ease-in-out infinite alternate}
body::before{top:-25vmax;left:-20vmax}
body::after{bottom:-30vmax;right:-25vmax;animation-delay:-11s}
body{padding-bottom:calc(env(safe-area-inset-bottom) + 104px)}
.tab,.btn,.chip,.nav button{position:relative;overflow:hidden}
.tab,.btn{transition:transform .25s var(--ease),background .3s,color .3s,border-color .3s,box-shadow .9s var(--ease)}
li{gap:10px;transition:transform .3s var(--ease),background .3s,border-color .3s,box-shadow .9s var(--ease)}
.view{display:none}
.view.on{display:block;animation:vin .7s var(--ease)}
.cv{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:18px;border:1px solid #333}
.cv span{color:#fff;mix-blend-mode:difference}
.hb{flex:none;background:none;border:0;color:var(--mut);font-size:22px;width:36px;height:36px;border-radius:12px;transition:transform .3s var(--ease),color .3s,text-shadow .3s}
.hb.on{color:#fff;text-shadow:0 0 14px #fff;animation:pop .6s var(--ease)}
.hb:active{transform:scale(.8)}
.g{box-shadow:0 0 36px rgba(255,255,255,.35)}
.tab.on{box-shadow:0 0 22px rgba(255,255,255,.35)}
.nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);max-width:536px;margin:0 auto;display:flex;border:1px solid #2a2a2a;border-radius:22px;background:rgba(10,10,10,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);overflow:hidden}
.nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:1;transition:color .4s,transform .3s var(--ease)}
.nav button b{font-size:20px;font-weight:400;line-height:1}
.nav button.on{color:#fff}
.nav button:active{transform:scale(.9)}
#ind{position:absolute;top:0;bottom:0;left:0;width:25%;background:rgba(255,255,255,.1);border-radius:22px;box-shadow:0 0 24px rgba(255,255,255,.18);transition:transform .6s var(--ease)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 22px}
.chip{border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:14px;padding:10px 16px;border-radius:999px;transition:transform .25s var(--ease),background .3s,color .3s,box-shadow .5s}
.chip.on{background:#fff;color:#000;box-shadow:0 0 22px rgba(255,255,255,.4)}
.chip:active{transform:scale(.94)}
h2{font-size:22px;margin:4px 0 12px}
h3{font-size:13px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.08em}
#toast{bottom:calc(env(safe-area-inset-bottom) + 92px)}
.rp{background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 65%)}
@keyframes vin{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(6px)}}
@keyframes pop{40%{transform:scale(1.55)}}
@keyframes dr{to{transform:translate(12vmax,10vmax) scale(1.2)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes rp{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="logo">sh1zuho finder</h1>
  <p class="sub" id="st"></p>
  <section class="view on" id="v-home">
  <div class="search"><input id="q" placeholder="Название, исполнитель или код" autocomplete="off" enterkeyhint="search"><button id="clr" aria-label="Очистить">✕</button></div>
  <div class="tabs"><button class="tab on" data-t="all" data-i="all"></button><button class="tab" data-t="new" data-i="new"></button><button class="tab" id="rnd" data-i="rand"></button></div>
  <ul id="list"></ul>
  <button class="btn" id="more" data-i="more"></button>
  </section>
  <section class="view" id="v-fav"><h2 data-i="nFav"></h2><ul id="flist"></ul></section>
  <section class="view" id="v-hist"><h2 data-i="nHist"></h2><ul id="hlist"></ul></section>
  <section class="view" id="v-set"><h2 data-i="nSet"></h2><h3 data-i="lang"></h3><div class="chips" id="chips"></div><button class="btn" id="cf" data-i="clear"></button></section>
</main>
<nav class="nav"><i id="ind"></i><button class="on"><b>⌕</b><span data-i="nHome"></span></button><button><b>♡</b><span data-i="nFav"></span></button><button><b>◷</b><span data-i="nHist"></span></button><button><b>⚙&#xFE0E;</b><span data-i="nSet"></span></button></nav>
<div id="toast"></div>
<script>
const B='https://lylib.fun';
const SEARCH_URL=''; // адрес поиска lylib, например 'https://lylib.fun/library?q=' (подставим после проверки)
const $=s=>document.querySelector(s);
let db={};try{db=JSON.parse(localStorage.getItem('db')||'{}')}catch(_){}
let tab='all',busy=false;
const save=()=>{try{localStorage.setItem('db',JSON.stringify(db))}catch(_){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setSt=t=>$('#st').textContent=t;
const get=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.text()};
const ids=h=>[...new Set([...h.matchAll(/\/song\/(\d+)/g)].map(m=>+m[1]))];
const keys=()=>Object.keys(db).map(Number);

async function song(id){
  try{
    const d=new DOMParser().parseFromString(await get(`${B}/song/${id}`),'text/html');
    const c=(d.body.textContent.match(/Roblox ID\s*(\d{4,})/)||[])[1];
    const t=d.querySelector('h1')?.textContent.trim();
    if(!c||!t)return null;
    const a=[...d.querySelectorAll('a[href*="/artist/"]')].map(x=>x.textContent.trim()).join(', ');
    return db[id]={id,t,a,c,n:Date.now()};
  }catch(_){return null}
}
async function pool(list,n,fn){const q=[...list];await Promise.all(Array.from({length:n},async()=>{while(q.length)await fn(q.shift())}))}

async function sync(){
  if(busy)return;busy=true;setSt(t('sync'));
  try{
    const home=ids(await get(B+'/'));let total=0;
    for(let r=0;r<6;r++){
      const base=Math.max(0,...keys(),...home);
      const todo=[...new Set([...home,...Array.from({length:12},(_,i)=>base+1+i)])].filter(i=>!db[i]);
      let add=0;await pool(todo,3,async i=>{if(await song(i))add++});
      total+=add;save();render();
      if(!add)break;
    }
    setSt(total?t('added',total):t('fresh'));
  }catch(_){setSt(t('off'))}
  busy=false;
}
async function older(){
  const k=keys();if(!k.length)return sync();
  const lo=Math.min(...k);setSt(t('old'));
  await pool(Array.from({length:40},(_,i)=>lo-1-i).filter(i=>i>0&&!db[i]),3,song);
  save();render();setSt(t('done'));
}
let tm;
function remote(q){
  if(!SEARCH_URL||q.length<2)return;
  clearTimeout(tm);tm=setTimeout(async()=>{
    try{
      const found=ids(await get(SEARCH_URL+encodeURIComponent(q))).filter(i=>!db[i]).slice(0,20);
      await pool(found,3,song);save();render();
    }catch(_){}
  },500);
}
const K='ph all new more none sync added fresh off old done copied nHome nFav nHist nSet rand favE histE clear lang'.split(' ');
const T={
ru:['Название, исполнитель или код','Все','Новые за сутки','Загрузить старые треки','Ничего не найдено','Ищу новые коды…','Добавлено новых кодов: {n}','Всё актуально','Нет связи с lylib.fun','Загружаю старые треки…','Готово','Код {n} скопирован','Поиск','Избранное','История','Настройки','Случайный код','Здесь появятся ваши избранные треки','Здесь появятся скопированные коды','Очистить историю','Язык'],
en:['Title, artist or code','All','New today','Load older tracks','Nothing found','Looking for new codes…','New codes added: {n}','Up to date',"Can't reach lylib.fun",'Loading older tracks…','Done','Code {n} copied','Search','Favorites','History','Settings','Random code','Your favorite tracks will appear here','Copied codes will appear here','Clear history','Language'],
uk:['Назва, виконавець або код','Усі','Нові за добу','Завантажити старі треки','Нічого не знайдено','Шукаю нові коди…','Додано нових кодів: {n}','Усе актуально',"Немає зв'язку з lylib.fun",'Завантажую старі треки…','Готово','Код {n} скопійовано','Пошук','Обране','Історія','Налаштування','Випадковий код',"Тут з'являться ваші обрані треки","Тут з'являться скопійовані коди",'Очистити історію','Мова'],
es:['Título, artista o código','Todos','Nuevos hoy','Cargar pistas antiguas','No se encontró nada','Buscando códigos nuevos…','Códigos nuevos: {n}','Todo al día','Sin conexión con lylib.fun','Cargando pistas antiguas…','Listo','Código {n} copiado','Buscar','Favoritos','Historial','Ajustes','Código aleatorio','Aquí aparecerán tus favoritos','Aquí aparecerán los códigos copiados','Borrar historial','Idioma'],
de:['Titel, Künstler oder Code','Alle','Neu heute','Ältere Tracks laden','Nichts gefunden','Suche neue Codes…','Neue Codes: {n}','Alles aktuell','Keine Verbindung zu lylib.fun','Lade ältere Tracks…','Fertig','Code {n} kopiert','Suche','Favoriten','Verlauf','Einstellungen','Zufälliger Code','Hier erscheinen deine Favoriten','Hier erscheinen kopierte Codes','Verlauf leeren','Sprache'],
tr:['Başlık, sanatçı veya kod','Tümü','Bugün yeni','Eski parçaları yükle','Sonuç yok','Yeni kodlar aranıyor…','Eklenen yeni kod: {n}','Güncel',"lylib.fun'a ulaşılamıyor",'Eski parçalar yükleniyor…','Tamam','{n} kodu kopyalandı','Ara','Favoriler','Geçmiş','Ayarlar','Rastgele kod','Favori parçaların burada görünür','Kopyalanan kodlar burada görünür','Geçmişi temizle','Dil']};
const NAMES={ru:'Русский',en:'English',uk:'Українська',es:'Español',de:'Deutsch',tr:'Türkçe'};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(_){return d}};
let lang=localStorage.getItem('lang');if(!T[lang])lang='ru';
let fav=ld('fav',{}),hist=ld('hist',[]),view='home';
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}};
const t=(k,n)=>(T[lang][K.indexOf(k)]||T.ru[K.indexOf(k)]).replace('{n}',n);

const hue=id=>{const h=(id*2654435761)>>>0;return[h%360,20+h%50,50+(h>>8)%40]};
function row(x,i){
  const[a,b,c]=hue(x.id),f=fav[x.id];
  return `<li style="--i:${Math.min(i,14)}" data-c="${esc(x.c)}" data-id="${x.id}"><div class="cv" style="background:conic-gradient(from ${a}deg,#000,#fff ${b}%,#000 ${c}%,#666)"><span>${esc([...x.t][0]||'♪')}</span></div><div class="tx"><b>${esc(x.t)}</b><span>${esc(x.a)}</span></div><button class="hb${f?' on':''}" data-f="${x.id}" aria-label="fav">${f?'♥':'♡'}</button><code>${esc(x.c)}</code></li>`;
}
function render(){
  const q=$('#q').value.trim().toLowerCase();
  let a=Object.values(db).sort((x,y)=>y.id-x.id);
  if(tab==='new')a=a.filter(x=>x.n>Date.now()-864e5);
  if(q)a=a.filter(x=>(x.t+' '+x.a+' '+x.c).toLowerCase().includes(q));
  const L=(arr,e)=>arr.slice(0,200).map(row).join('')||`<li class="empty">${esc(t(e))}</li>`;
  $('#list').innerHTML=L(a,'none');
  $('#flist').innerHTML=L(Object.keys(fav).map(i=>db[i]).filter(Boolean).sort((x,y)=>y.id-x.id),'favE');
  $('#hlist').innerHTML=L(hist.map(i=>db[i]).filter(Boolean),'histE');
}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('#q').placeholder=t('ph');
  $('#chips').innerHTML=Object.keys(T).map(l=>`<button class="chip${l===lang?' on':''}" data-l="${l}">${NAMES[l]}</button>`).join('');
  render();
}
const V=['home','fav','hist','set'];
function go(v){
  view=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',V[i]===v));
  $('#ind').style.transform=`translateX(${V.indexOf(v)*100}%)`;
  if(v==='fav'||v==='hist')render();
  scrollTo({top:0,behavior:'smooth'});
}
let tt;
function toast(x){const e=$('#toast');e.textContent=x;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)}
async function copy(c,id,label){
  try{await navigator.clipboard.writeText(c)}catch(_){const x=document.createElement('textarea');x.value=c;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}
  if(id){hist=[+id,...hist.filter(i=>i!==+id)].slice(0,100);sv('hist',hist)}
  toast(t('copied',c)+(label?' · '+label:''));
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('li[data-c],.tab,.btn,.chip,.nav button');if(!el)return;
  const r=el.getBoundingClientRect(),s=document.createElement('i'),d=Math.max(r.width,r.height)*2.2;
  s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  el.appendChild(s);el.classList.add('g');
  setTimeout(()=>el.classList.remove('g'),180);setTimeout(()=>s.remove(),900);
});
document.addEventListener('click',e=>{
  const h=e.target.closest('.hb');
  if(h){
    const id=h.dataset.f;if(fav[id])delete fav[id];else fav[id]=1;sv('fav',fav);
    document.querySelectorAll(`.hb[data-f="${id}"]`).forEach(b=>{b.classList.toggle('on',!!fav[id]);b.textContent=fav[id]?'♥':'♡'});
    if(view==='fav')setTimeout(render,350);
    return;
  }
  const li=e.target.closest('li[data-c]');if(li){copy(li.dataset.c,li.dataset.id);return}
  const c=e.target.closest('.chip');if(c){lang=c.dataset.l;localStorage.setItem('lang',lang);applyLang()}
});
$('#logo').innerHTML=[...'sh1zuho finder'].map((ch,i)=>`<span style="--d:${i*45}ms">${ch===' '?'&nbsp;':ch}</span>`).join('');
$('#q').addEventListener('input',()=>{render();remote($('#q').value.trim())});
$('#clr').addEventListener('click',()=>{$('#q').value='';render();$('#q').focus()});
document.querySelectorAll('.tab[data-t]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab[data-t]').forEach(x=>x.classList.toggle('on',x===b));tab=b.dataset.t;render();
}));
$('#rnd').addEventListener('click',()=>{const k=keys();if(!k.length)return;const x=db[k[Math.random()*k.length|0]];copy(x.c,x.id,x.t)});
$('#cf').addEventListener('click',()=>{hist=[];sv('hist',hist);render()});
document.querySelectorAll('.nav button').forEach((b,i)=>b.addEventListener('click',()=>go(V[i])));
$('#more').addEventListener('click',older);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(sync,6e5);
applyLang();sync();
</script>
</body>
</html>
