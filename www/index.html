<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="sf-api" content="">
<title>sh1zuho finder</title>
<style>
:root{--bg:#050505;--fg:#f5f5f5;--mut:#8c8c8c;--ln:#262626;--cd:#0d0d0d;--e:cubic-bezier(.22,1,.36,1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#ffffff08 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,#ffffff08 1px,transparent 1px) 0 0/48px 48px}
#bg i{position:absolute;left:-15vmax;top:-20vmax;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(#ffffff1f,transparent 62%);animation:dr 22s ease-in-out infinite alternate}
#bg i+i{left:auto;top:auto;right:-20vmax;bottom:-25vmax;animation-duration:30s;animation-direction:alternate-reverse}
@keyframes dr{to{transform:translate(12vmax,8vmax) scale(1.2)}}
#app{max-width:560px;margin:0 auto;padding:22px 18px 40px;transition:opacity .22s,transform .22s,filter .22s}
#app.out{opacity:0;transform:translateY(10px) scale(.985);filter:blur(6px)}
.st{animation:rise .7s var(--e) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(6px)}}
.logo{font-weight:800;letter-spacing:-.04em;font-size:30px;background:linear-gradient(100deg,#777 20%,#fff 50%,#777 80%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.logo.s{font-size:22px}.logo span{font-weight:500}
@keyframes sh{to{background-position:-250% 0}}
.win{margin-top:6vh;border:1px solid var(--ln);background:#0b0b0bcc;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:26px;padding:24px;box-shadow:0 30px 80px #000}
h2{margin:14px 0 16px;font-size:20px;letter-spacing:-.02em}
.sw{animation:sw .5s var(--e)}@keyframes sw{from{opacity:0;transform:translateY(8px);filter:blur(4px)}}
.btn{position:relative;overflow:hidden;display:inline-block;text-align:center;text-decoration:none;border:1px solid var(--fg);background:var(--fg);color:#000;font-family:inherit;font-weight:600;font-size:15px;padding:14px 20px;border-radius:14px;cursor:pointer;transition:transform .35s var(--e),background .3s,color .3s,border-color .3s,box-shadow .4s}
.btn:hover{box-shadow:0 0 0 4px #ffffff14}.btn:active{transform:scale(.95)}
.btn.g{background:transparent;color:var(--fg);border-color:var(--ln)}
.btn.s{padding:10px 14px;border-radius:12px;font-size:13px;white-space:nowrap}
.btn.ld{pointer-events:none}.btn.ld::after{content:"";display:inline-block;width:15px;height:15px;margin-left:10px;vertical-align:-3px;border:2px solid #0004;border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rp .7s var(--e) forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{position:relative;overflow:hidden;text-align:left;padding:14px 16px;border-radius:16px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);font:inherit;cursor:pointer;transition:transform .4s var(--e),background .35s,color .35s,border-color .35s}
.ch b{display:block;font-size:11px;letter-spacing:.14em;opacity:.55;margin-bottom:4px}
.ch:active{transform:scale(.94)}.ch.on{background:var(--fg);color:#000;border-color:var(--fg);transform:translateY(-2px)}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#0a0a0a;border:1px solid var(--ln);border-radius:14px;padding:4px;margin:18px 0}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--fg);border-radius:10px;transition:transform .5s var(--e)}
.tabs.r i{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;background:none;border:0;color:var(--mut);font-family:inherit;font-weight:600;font-size:14px;padding:11px;cursor:pointer;transition:color .3s}
.tabs button.on{color:#000}
.f{position:relative;margin-bottom:12px}
.f input,.q{width:100%;padding:22px 14px 8px;border-radius:14px;border:1px solid var(--ln);background:#0a0a0a;color:var(--fg);font:inherit;font-size:16px;outline:0;transition:border-color .3s,box-shadow .4s}
.q{padding:15px 16px;flex:1}
.f input:focus,.q:focus{border-color:var(--fg);box-shadow:0 0 0 4px #ffffff12}
.f label{position:absolute;left:15px;top:16px;color:var(--mut);pointer-events:none;transition:all .3s var(--e)}
.f input:focus+label,.f input:not(:placeholder-shown)+label{top:7px;font-size:11px;letter-spacing:.06em;color:#bbb}
.col{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s var(--e),opacity .4s}
.col.o{grid-template-rows:1fr;opacity:1}.col>div{overflow:hidden}
.msg{min-height:20px;color:#ddd;font-size:13px;margin:6px 2px 10px}.hint{color:var(--mut);font-size:12px;margin-top:14px}
.shake{animation:sk .45s}@keyframes sk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.me{display:flex;align-items:center;gap:8px;color:var(--mut)}
.bd{font-size:10px;padding:4px 9px;border-radius:99px;border:1px solid var(--fg);color:var(--fg);letter-spacing:.08em;text-transform:uppercase}
.row{display:flex;gap:10px;margin-bottom:10px}.ic{padding:0 18px}.ic span{display:inline-block}.ic.sp span{animation:spin 1s linear infinite}
.inf{color:var(--mut);font-size:12px;margin:0 2px 14px}
.cd{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--ln);background:var(--cd);border-radius:18px;margin-bottom:10px;transition:transform .4s var(--e),border-color .3s}
.cd:hover{border-color:#555}.cd:active{transform:scale(.975)}
.cd .m{flex:1;min-width:0}.n,.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n{font-weight:600}.a{color:var(--mut);font-size:13px}
code{font:12px ui-monospace,Menlo,monospace;color:#bbb}
.bot{display:flex;gap:10px;margin-top:22px}.bot .btn{flex:1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="bg"><i></i><i></i></div>
<main id="app"></main>
<script>
const K=['pick','go','login','reg','user','pass','mail','code','confirm','search','copy','copied','open','dev','out','local','err','taken','pend','empty','sent'];
const T={
ru:['Выберите язык','Продолжить','Вход','Регистрация','Логин','Пароль','Почта','Код из письма','Подтвердить','Название, автор или код','Копировать','Готово','Открыть на lylib','разработчик','Выйти','Локальный режим: кода на почту нет, вход по логину и паролю','Проверьте данные и попробуйте снова','Этот логин уже занят','Код появится после синхронизации','Ничего не найдено','Код отправлен на'],
en:['Choose your language','Continue','Sign in','Sign up','Username','Password','Email','Code from the email','Confirm','Title, artist or code','Copy','Done','Open on lylib','developer','Log out','Local mode: no email code, sign in with username and password','Check your details and try again','This username is taken','Code appears after sync','Nothing found','Code sent to'],
uk:['Оберіть мову','Продовжити','Вхід','Реєстрація','Логін','Пароль','Пошта','Код із листа','Підтвердити','Назва, автор або код','Копіювати','Готово','Відкрити на lylib','розробник','Вийти','Локальний режим: без коду на пошту, вхід за логіном і паролем','Перевірте дані та спробуйте ще раз','Цей логін зайнятий','Код з’явиться після синхронізації','Нічого не знайдено','Код надіслано на'],
de:['Sprache wählen','Weiter','Anmelden','Registrieren','Benutzername','Passwort','E-Mail','Code aus der E-Mail','Bestätigen','Titel, Künstler oder Code','Kopieren','Fertig','Auf lylib öffnen','Entwickler','Abmelden','Lokaler Modus: kein E-Mail-Code, Anmeldung mit Benutzername und Passwort','Angaben prüfen und erneut versuchen','Benutzername vergeben','Code erscheint nach der Synchronisierung','Nichts gefunden','Code gesendet an'],
es:['Elige tu idioma','Continuar','Entrar','Registro','Usuario','Contraseña','Correo','Código del correo','Confirmar','Título, artista o código','Copiar','Listo','Abrir en lylib','desarrollador','Salir','Modo local: sin código por correo, acceso con usuario y contraseña','Revisa los datos e inténtalo de nuevo','Ese usuario ya existe','El código aparecerá tras sincronizar','Sin resultados','Código enviado a'],
tr:['Dilini seç','Devam','Giriş','Kayıt','Kullanıcı adı','Şifre','E-posta','E-postadaki kod','Onayla','Başlık, sanatçı veya kod','Kopyala','Tamam','lylib’de aç','geliştirici','Çıkış','Yerel mod: e-posta kodu yok, kullanıcı adı ve şifre ile giriş','Bilgileri kontrol edip tekrar dene','Bu kullanıcı adı alınmış','Kod senkronizasyondan sonra görünür','Sonuç yok','Kod gönderildi:']};
const LN=[['ru','Русский'],['en','English'],['uk','Українська'],['de','Deutsch'],['es','Español'],['tr','Türkçe']];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const DEV='702e2c6a6d479cedc26aa8a687013df5787bb1e2f6bb8e503cd94fdf92bae41a';
const SEED=[[5255,'madk1d,villian','ДИНАСТИЯЯЯЯ (не рабочая вроде)'],[5254,'ELYSORNE','Пустота и Темнота','106739854526550'],[5253,'푸른 사이','어깨만 먼저'],[5252,'mint','思念'],[5250,'6ix9ine','Mala'],[5249,'Goodkid','No Time To Explain'],[5248,'Sematary','WORLDS A F*CK'],[5247,'latex fruit','#voyuitwaaien'],[5246,'FireRecords','song_52'],[5245,'Alanwaad','MONTAGEM NYAN']].map(([id,a,n,c])=>({id,a,n,code:c||null}));
let lang=G('sf_lang',null),sess=G('sf_sess',null),users=G('sf_users',{}),tracks=G('sf_tracks',SEED),last=G('sf_last',0),mode='l',step='',srv=false,syncing=false;
users.sh1zuho={hash:DEV,role:'dev',email:''};S('sf_users',users);
const t=k=>(T[lang]||T.en)[K.indexOf(k)];
const API=window.SF_API||document.querySelector('meta[name=sf-api]')?.content||'';
async function jf(p,b){const r=await fetch(API+p,{method:b?'POST':'GET',headers:{'content-type':'application/json'},body:b&&JSON.stringify(b),signal:AbortSignal.timeout(6000)});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===undefined&&j.tracks===undefined&&!j.user&&!j.sent)throw j;return j}
async function probe(){try{await jf('/api/health');srv=true}catch{srv=false}}
async function hp(l,p){const e=new TextEncoder(),k=await crypto.subtle.importKey('raw',e.encode(p),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:e.encode('sh1zuho:'+l),iterations:150000},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function show(h,after){const a=$('#app');const put=()=>{a.innerHTML=h;a.classList.remove('out');after&&after()};if(!a.innerHTML)return put();a.classList.add('out');setTimeout(put,230)}
/* ---------- views ---------- */
function vLang(){show(`<div class="win st"><div class="logo">sh1zuho <span>finder</span></div><h2 id="pk" class="sw">${t('pick')}</h2><div class="lg">${LN.map(([c,n],i)=>`<button class="ch st${c==lang?' on':''}" style="--i:${i+2}" data-l="${c}"><b>${c.toUpperCase()}</b>${n}</button>`).join('')}</div><button class="btn st" style="--i:9;width:100%;margin-top:18px" id="go">${t('go')}</button></div>`)}
function vAuth(){step='';const r=mode=='r';show(`<div class="win st"><div class="logo">sh1zuho <span>finder</span></div><div class="tabs${r?' r':''}" id="tb"><i></i><button data-m="l" class="${r?'':'on'}">${t('login')}</button><button data-m="r" class="${r?'on':''}">${t('reg')}</button></div><div id="fm"><div class="f"><input id="u" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false"><label for="u">${t('user')}</label></div><div class="col${r?' o':''}" id="em"><div><div class="f"><input id="e" type="email" placeholder=" " autocomplete="email"><label for="e">${t('mail')}</label></div></div></div><div class="f"><input id="p" type="password" placeholder=" " autocomplete="${r?'new-password':'current-password'}"><label for="p">${t('pass')}</label></div></div><div class="msg" id="ms"></div><button class="btn" id="ok" style="width:100%">${t(r?'reg':'login')}</button><div class="hint">${srv?'':t('local')}</div></div>`)}
function vHome(){show(`<div class="top st"><div class="logo s">sh1zuho <span>finder</span></div><div class="me"><span>${esc(sess.login)}</span>${sess.role=='dev'?`<span class="bd">${t('dev')}</span>`:''}</div></div><div class="row st" style="--i:1"><input class="q" id="q" placeholder="${t('search')}" autocomplete="off"><button class="btn g ic" id="sy"><span>⟳</span></button></div><div class="inf st" style="--i:2" id="inf"></div><div id="ls"></div><div class="bot st" style="--i:3"><button class="btn g" data-a="lang">${lang.toUpperCase()}</button><button class="btn g" id="lo">${t('out')}</button></div>`,()=>{list(true);info();sync()})}
function list(anim){const q=($('#q')?.value||'').trim().toLowerCase();const a=tracks.filter(x=>!q||[x.n,x.a,x.code,x.id].join(' ').toLowerCase().includes(q)).slice(0,80);
$('#ls').innerHTML=a.length?a.map((x,i)=>`<div class="cd${anim?' st':''}" style="--i:${Math.min(i,12)+3}"><div class="m"><div class="n">${esc(x.n)}</div><div class="a">${esc(x.a)}</div><code>${esc(x.code||t('pend'))}</code></div>${x.code?`<button class="btn s" data-c="${esc(x.code)}">${t('copy')}</button>`:`<a class="btn s g" href="https://lylib.fun/song/${+x.id}" target="_blank" rel="noopener">${t('open')}</a>`}</div>`).join(''):`<p class="msg">${t('empty')}</p>`}
function info(){const e=$('#inf');if(e)e.textContent=tracks.length+' · '+(last?new Date(last).toLocaleTimeString():'—')}
/* ---------- auth ---------- */
const busy=b=>$('#ok')?.classList.toggle('ld',b);
function fail(k){const m=$('#ms'),w=$('.win');m.textContent=t(k);w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}
function enter(u){sess=u;S('sf_sess',u);vHome()}
async function submit(){const ms=$('#ms');ms.textContent='';
if(step=='code'){busy(true);try{enter((await jf('/api/verify',{login:$('#u')?.value||pend,code:$('#cd').value.trim()})).user)}catch{fail('err')}busy(false);return}
const l=$('#u').value.trim().toLowerCase(),p=$('#p').value,r=mode=='r',e=$('#e').value.trim();
if(!l||!p||r&&(!/^[a-z0-9_]{3,20}$/.test(l)||p.length<6||!/^\S+@\S+\.\S+$/.test(e)))return fail('err');
busy(true);try{
if(!r){if(srv)enter((await jf('/api/login',{login:l,pass:p})).user);else{const u=users[l];if(!u||u.hash!==await hp(l,p))throw 0;enter({login:l,role:u.role||'user'})}}
else if(srv){const j=await jf('/api/register',{login:l,email:e,pass:p});if(j.user)enter(j.user);else toCode(l,e)}
else{if(users[l])throw{e:'taken'};users[l]={hash:await hp(l,p),email:e,role:'user'};S('sf_users',users);enter({login:l,role:'user'})}
}catch(x){fail(x&&x.e=='taken'?'taken':'err')}busy(false)}
let pend='';
function toCode(l,e){step='code';pend=l;$('#fm').innerHTML=`<p class="msg sw">${t('sent')} ${esc(e)}</p><div class="f sw"><input id="cd" inputmode="numeric" maxlength="6" placeholder=" " autocomplete="one-time-code" style="letter-spacing:.5em;font-size:22px"><label for="cd">${t('code')}</label></div>`;$('#ok').textContent=t('confirm');$('#cd').focus()}
/* ---------- lylib sync ---------- */
function parse(id,h){const d=new DOMParser().parseFromString(h,'text/html');const p=d.title.replace(/\s*[—-]\s*код музыки Roblox.*$/,'').split(' — ');const c=(d.body.textContent.match(/Roblox ID\D{0,40}?(\d{6,20})/)||[])[1];if(!c)throw 0;return{id,a:(p.shift()||'').trim(),n:p.join(' — ').trim(),code:c}}
async function nativeSync(){const H=window.Capacitor.Plugins.CapacitorHttp,get=u=>H.get({url:u,responseType:'text'}).then(r=>String(r.data));
const home=await get('https://lylib.fun/'),have=new Map(tracks.map(x=>[x.id,x]));const out=[];
for(const id of[...new Set([...home.matchAll(/\/song\/(\d+)/g)].map(m=>+m[1]))].sort((a,b)=>b-a).filter(i=>!have.get(i)?.code).slice(0,25)){try{out.push(parse(id,await get('https://lylib.fun/song/'+id)))}catch{}}return out}
async function sync(){if(syncing||!sess)return;syncing=true;$('#sy')?.classList.add('sp');
try{let n=[];if(window.Capacitor?.isNativePlatform?.())n=await nativeSync();else if(srv)n=(await jf('/api/tracks')).tracks||[];
if(n.length){const m=new Map(tracks.map(x=>[x.id,x]));n.forEach(x=>m.set(x.id,{...m.get(x.id),...x}));tracks=[...m.values()].sort((a,b)=>b.id-a.id).slice(0,500);S('sf_tracks',tracks);list(true)}
last=Date.now();S('sf_last',last);info()}catch{}
syncing=false;$('#sy')?.classList.remove('sp')}
/* ---------- events ---------- */
async function cp(b){const c=b.dataset.c;try{await navigator.clipboard.writeText(c)}catch{const x=document.createElement('textarea');x.value=c;document.body.append(x);x.select();document.execCommand('copy');x.remove()}
const o=b.textContent;b.textContent='✓ '+t('copied');b.classList.add('g');setTimeout(()=>{b.textContent=o;b.classList.remove('g')},1400)}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.ch,.cd');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,i=document.createElement('span');i.className='rip';i.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.append(i);setTimeout(()=>i.remove(),750)});
document.addEventListener('click',e=>{const x=e.target.closest('[data-l],#go,[data-m],#ok,[data-c],#sy,#lo,[data-a]');if(!x)return;
if(x.dataset.l){lang=x.dataset.l;S('sf_lang',lang);document.documentElement.lang=lang;document.querySelectorAll('.ch').forEach(c=>c.classList.toggle('on',c==x));const p=$('#pk'),g=$('#go');p.textContent=t('pick');g.textContent=t('go');p.classList.remove('sw');void p.offsetWidth;p.classList.add('sw')}
else if(x.id=='go')sess?vHome():vAuth();
else if(x.dataset.m){mode=x.dataset.m;const r=mode=='r';$('#tb').classList.toggle('r',r);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b==x));$('#em').classList.toggle('o',r);$('#ok').textContent=t(r?'reg':'login');$('#ms').textContent='';$('#p').autocomplete=r?'new-password':'current-password'}
else if(x.id=='ok')submit();
else if(x.dataset.c)cp(x);
else if(x.id=='sy')sync();
else if(x.id=='lo'){sess=null;S('sf_sess',null);mode='l';vAuth()}
else if(x.dataset.a=='lang')vLang()});
document.addEventListener('input',e=>{if(e.target.id=='q')list(false)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.closest('#fm'))$('#ok').click()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});setInterval(sync,3e5);
(async()=>{await probe();if(lang)document.documentElement.lang=lang;if(!lang)vLang();else if(!sess)vAuth();else vHome()})();
</script>
</body>
</html>
