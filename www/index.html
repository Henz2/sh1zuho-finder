<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>sh1zuho finder</title>
<style>
:root{--bg:#000;--fg:#fff;--mut:#8a8a8a;--line:#222;--card:#0b0b0b;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em}
#logo span{display:inline-block;animation:up .9s var(--ease) var(--d) backwards}
.sub{color:var(--mut);font-size:13px;margin:4px 0 18px;animation:up .9s var(--ease) .5s backwards}
.search{position:relative;margin-bottom:12px;animation:up .9s var(--ease) .6s backwards}
input{width:100%;padding:15px 44px 15px 16px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;font:inherit;outline:0;transition:border-color .3s,box-shadow .4s var(--ease)}
input:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
#clr{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;border-radius:12px;background:none;color:var(--mut);font-size:16px;transition:transform .25s var(--ease),color .2s}
#clr:active{transform:scale(.8);color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:16px;animation:up .9s var(--ease) .7s backwards}
.tab,.btn{border:1px solid var(--line);background:none;color:var(--fg);font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;transition:transform .25s var(--ease),background .3s,color .3s,border-color .3s}
.tab.on{background:#fff;color:#000;border-color:#fff}
.tab:active,.btn:active{transform:scale(.94)}
.btn{display:block;width:100%;margin-top:6px;padding:14px;border-radius:16px;color:var(--mut)}
ul{padding:0}
li{list-style:none;position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;margin-bottom:8px;border:1px solid var(--line);border-radius:16px;background:var(--card);animation:up .6s var(--ease) calc(var(--i)*45ms) backwards;transition:transform .3s var(--ease),background .3s,border-color .3s}
li:active{transform:scale(.97);background:#151515;border-color:#555}
li.empty{justify-content:center;color:var(--mut);border-style:dashed}
.tx{min-width:0}
.tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx span{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
code{font:600 13px ui-monospace,Menlo,Consolas,monospace;padding:6px 10px;border:1px solid #333;border-radius:10px;white-space:nowrap}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.2);transform:scale(0);animation:rp .7s var(--ease) forwards;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 28px);transform:translate(-50%,30px);opacity:0;background:#fff;color:#000;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;transition:transform .5s var(--ease),opacity .3s}
#toast.on{transform:translate(-50%,0);opacity:1}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes rp{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <h1 id="logo">sh1zuho finder</h1>
  <p class="sub" id="st">Запуск…</p>
  <div class="search"><input id="q" placeholder="Название, исполнитель или код" autocomplete="off" enterkeyhint="search"><button id="clr" aria-label="Очистить">✕</button></div>
  <div class="tabs"><button class="tab on" data-t="all">Все</button><button class="tab" data-t="new">Новые за сутки</button></div>
  <ul id="list"></ul>
  <button class="btn" id="more">Загрузить старые треки</button>
</main>
<div id="toast"></div>
<script>
const B='https://lylib.fun';
const SEARCH_URL=''; // адрес поиска lylib, например 'https://lylib.fun/library?q=' (подставим после проверки)
const $=s=>document.querySelector(s);
let db={};try{db=JSON.parse(localStorage.getItem('db')||'{}')}catch(_){}
let tab='all',busy=false;
const save=()=>{try{localStorage.setItem('db',JSON.stringify(db))}catch(_){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const setSt=t=>$('#st').textContent=t;
const get=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.text()};
const ids=h=>[...new Set([...h.matchAll(/\/song\/(\d+)/g)].map(m=>+m[1]))];
const keys=()=>Object.keys(db).map(Number);

async function song(id){
  try{
    const d=new DOMParser().parseFromString(await get(`${B}/song/${id}`),'text/html');
    const c=(d.body.textContent.match(/Roblox ID\s*(\d{4,})/)||[])[1];
    const t=d.querySelector('h1')?.textContent.trim();
    if(!c||!t)return null;
    const a=[...d.querySelectorAll('a[href*="/artist/"]')].map(x=>x.textContent.trim()).join(', ');
    return db[id]={id,t,a,c,n:Date.now()};
  }catch(_){return null}
}
async function pool(list,n,fn){const q=[...list];await Promise.all(Array.from({length:n},async()=>{while(q.length)await fn(q.shift())}))}

async function sync(){
  if(busy)return;busy=true;setSt('Ищу новые коды…');
  try{
    const home=ids(await get(B+'/'));let total=0;
    for(let r=0;r<6;r++){
      const base=Math.max(0,...keys(),...home);
      const todo=[...new Set([...home,...Array.from({length:12},(_,i)=>base+1+i)])].filter(i=>!db[i]);
      let add=0;await pool(todo,3,async i=>{if(await song(i))add++});
      total+=add;save();render();
      if(!add)break;
    }
    setSt(total?`Добавлено новых кодов: ${total}`:'Всё актуально');
  }catch(_){setSt('Нет связи с lylib.fun')}
  busy=false;
}
async function older(){
  const k=keys();if(!k.length)return sync();
  const lo=Math.min(...k);setSt('Загружаю старые треки…');
  await pool(Array.from({length:40},(_,i)=>lo-1-i).filter(i=>i>0&&!db[i]),3,song);
  save();render();setSt('Готово');
}
let tm;
function remote(q){
  if(!SEARCH_URL||q.length<2)return;
  clearTimeout(tm);tm=setTimeout(async()=>{
    try{
      const found=ids(await get(SEARCH_URL+encodeURIComponent(q))).filter(i=>!db[i]).slice(0,20);
      await pool(found,3,song);save();render();
    }catch(_){}
  },500);
}
function render(){
  const q=$('#q').value.trim().toLowerCase();
  let a=Object.values(db).sort((x,y)=>y.id-x.id);
  if(tab==='new')a=a.filter(x=>x.n>Date.now()-864e5);
  if(q)a=a.filter(x=>(x.t+' '+x.a+' '+x.c).toLowerCase().includes(q));
  $('#list').innerHTML=a.slice(0,200).map((x,i)=>`<li style="--i:${Math.min(i,14)}" data-c="${esc(x.c)}"><div class="tx"><b>${esc(x.t)}</b><span>${esc(x.a)}</span></div><code>${esc(x.c)}</code></li>`).join('')||'<li class="empty">Ничего не найдено</li>';
}
function ripple(el,e){
  const r=el.getBoundingClientRect(),s=document.createElement('i'),d=Math.max(r.width,r.height)*2;
  s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  el.appendChild(s);setTimeout(()=>s.remove(),700);
}
let tt;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
async function copy(c){
  try{await navigator.clipboard.writeText(c)}catch(_){const t=document.createElement('textarea');t.value=c;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
  toast('Код '+c+' скопирован');
}

$('#logo').innerHTML=[...'sh1zuho finder'].map((ch,i)=>`<span style="--d:${i*45}ms">${ch===' '?'&nbsp;':ch}</span>`).join('');
$('#list').addEventListener('click',e=>{const li=e.target.closest('li[data-c]');if(!li)return;ripple(li,e);copy(li.dataset.c)});
$('#q').addEventListener('input',()=>{render();remote($('#q').value.trim())});
$('#clr').addEventListener('click',()=>{$('#q').value='';render();$('#q').focus()});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));tab=b.dataset.t;render();
}));
$('#more').addEventListener('click',older);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
setInterval(sync,6e5);
render();sync();
</script>
</body>
</html>
