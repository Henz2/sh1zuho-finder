<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>sh1zuho finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
:root{--fg:#f5f5f5;--mut:#8c8c8c;--ln:#262626;--cd:#0a0a0ab8;--e:cubic-bezier(.22,1,.36,1);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:#000;color:var(--fg);font:15px/1.45 -apple-system,"SF Pro Text",Inter,"Segoe UI",Roboto,system-ui,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
#bg,#gl{position:fixed;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}
#gl{background:radial-gradient(280px circle at var(--x,50%) var(--y,25%),#ffffff18,transparent 70%)}
#app{max-width:560px;margin:0 auto;padding:18px 16px calc(150px + env(safe-area-inset-bottom,0px));transition:opacity .22s,transform .22s,filter .22s}
#app.out{opacity:0;transform:translateY(10px) scale(.985);filter:blur(6px)}
.st{animation:rise .7s var(--e) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98);filter:blur(6px)}}
.logo{font-weight:800;letter-spacing:-.04em;font-size:30px;background:linear-gradient(100deg,#777 20%,#fff 50%,#777 80%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.logo.s{font-size:21px}.logo span{font-weight:500}@keyframes sh{to{background-position:-250% 0}}
.win{margin-top:6vh;border:1px solid var(--ln);background:#0a0a0acc;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:26px;padding:22px;box-shadow:0 30px 80px #000}
h2{margin:14px 0 14px;font-size:19px;letter-spacing:-.02em}
.sw{animation:swp .5s var(--e)}@keyframes swp{from{opacity:0;transform:translateY(8px);filter:blur(4px)}}
.btn{position:relative;overflow:hidden;display:inline-block;text-align:center;text-decoration:none;border:1px solid var(--fg);background:var(--fg);color:#000;font-family:inherit;font-weight:600;font-size:15px;padding:14px 20px;border-radius:14px;cursor:pointer;transition:transform .35s var(--e),background .3s,color .3s,border-color .3s,box-shadow .4s}
.btn:hover{box-shadow:0 0 0 4px #ffffff14}.btn:active{transform:scale(.95)}
.btn.g{background:transparent;color:var(--fg);border-color:var(--ln)}.btn.g.on{background:var(--fg);color:#000;box-shadow:0 0 20px #fff6}
.btn.s{padding:9px 14px;border-radius:12px;font-size:13px}
.btn.ld{pointer-events:none}.btn.ld::after{content:"";display:inline-block;width:15px;height:15px;margin-left:10px;vertical-align:-3px;border:2px solid #0004;border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);animation:rp .7s var(--e) forwards;pointer-events:none}
@keyframes rp{to{transform:scale(1);opacity:0}}
.lg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ch{position:relative;overflow:hidden;text-align:left;padding:12px 12px;border-radius:14px;border:1px solid var(--ln);background:var(--cd);color:var(--fg);font:inherit;font-size:14px;cursor:pointer;transition:transform .4s var(--e),background .35s,color .35s,box-shadow .4s}
.ch b{display:block;font-size:10px;letter-spacing:.14em;opacity:.55;margin-bottom:3px}.ch:active{transform:scale(.93)}.ch.on{background:var(--fg);color:#000;transform:translateY(-2px);box-shadow:0 0 22px #fff5}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#0a0a0a;border:1px solid var(--ln);border-radius:14px;padding:4px;margin:16px 0}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--fg);border-radius:10px;transition:transform .5s var(--e)}.tabs.r i{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;background:none;border:0;color:var(--mut);font-family:inherit;font-weight:600;font-size:14px;padding:11px;cursor:pointer;transition:color .3s}.tabs button.on{color:#000}
.f{position:relative;margin-bottom:12px}
.f input,.q{width:100%;padding:22px 14px 8px;border-radius:14px;border:1px solid var(--ln);background:#0a0a0acc;color:var(--fg);font:inherit;font-size:16px;outline:0;transition:border-color .3s,box-shadow .4s}
.q{padding:15px 16px;flex:1}.f input:focus,.q:focus{border-color:var(--fg);box-shadow:0 0 0 4px #ffffff14,0 0 24px #ffffff22}
.f label{position:absolute;left:15px;top:16px;color:var(--mut);pointer-events:none;transition:all .3s var(--e)}
.f input:focus+label,.f input:not(:placeholder-shown)+label{top:7px;font-size:11px;letter-spacing:.06em;color:#bbb}
.col{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s var(--e),opacity .4s}.col.o{grid-template-rows:1fr;opacity:1}.col>div{overflow:hidden}
.msg{min-height:20px;color:#ddd;font-size:13px;margin:6px 2px 10px}.hint{color:var(--mut);font-size:12px;margin-top:14px}
.shake{animation:sk .45s}@keyframes sk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.me{display:flex;align-items:center;gap:8px;color:var(--mut)}
.bd{font-size:10px;padding:4px 9px;border-radius:99px;border:1px solid var(--fg);color:var(--fg);letter-spacing:.08em;text-transform:uppercase;box-shadow:0 0 12px #fff4}
.row{display:flex;gap:8px;margin-bottom:10px}.ic{padding:0 16px}.ic span{display:inline-block}.ic.sp span{animation:spin 1s linear infinite}
.inf{color:var(--mut);font-size:12px;margin:0 2px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.tg{font-size:12px;padding:4px 10px;border:1px solid #444;border-radius:99px;color:#ddd;animation:rise .5s var(--e) both}
.cd{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:11px;padding:11px;border:1px solid var(--ln);background:var(--cd);border-radius:18px;margin-bottom:9px;transition:transform .4s var(--e),border-color .3s,box-shadow .4s}
.cd:hover{border-color:#666;box-shadow:0 0 22px #ffffff12}.cd:active{transform:scale(.975)}
.cv{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#222,#050505);overflow:hidden;flex:none}.cv img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1)}
.m{flex:1;min-width:0}.n,.a{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.n{font-weight:600}.a{color:var(--mut);font-size:13px}
code{font:12px ui-monospace,Menlo,monospace;color:#bbb}
.bt{display:flex;gap:6px;flex:1 1 100%;justify-content:flex-end}
.ib{position:relative;overflow:hidden;width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:#0008;color:var(--fg);font:inherit;font-size:14px;cursor:pointer;display:grid;place-items:center;text-decoration:none;transition:transform .35s var(--e),background .3s,color .3s,box-shadow .4s}
.ib:active{transform:scale(.84)}.ib.on{background:var(--fg);color:#000;box-shadow:0 0 18px #fff7}
#pl{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:536px;margin:auto;z-index:20;display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #333;border-radius:18px;background:#0a0a0acc;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow:hidden;box-shadow:0 0 30px #ffffff12;animation:rise .6s var(--e)}
#pl[hidden],#nv[hidden]{display:none}#pl .cv{width:44px;height:44px}
#pb{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fff;box-shadow:0 0 10px #fff}
#nv{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#000c;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--ln)}
#nv button{position:relative;overflow:hidden;flex:1;max-width:130px;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:10px 4px;border-radius:12px;cursor:pointer;transition:color .3s,background .3s,box-shadow .4s}
#nv button.on{color:#000;background:var(--fg);box-shadow:0 0 18px #fff6}
#ts{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);padding:10px 16px;border-radius:99px;background:var(--fg);color:#000;font-size:13px;opacity:0;transition:.4s var(--e);z-index:60;pointer-events:none}#ts.on{opacity:1;transform:translate(-50%,0)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln)}.sr input{flex:1;max-width:55%;accent-color:#fff}
.tgl{width:48px;height:28px;border-radius:99px;border:1px solid #444;background:#111;position:relative;cursor:pointer;transition:background .3s,box-shadow .4s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#888;transition:transform .4s var(--e),background .3s}.tgl.on{background:var(--fg);box-shadow:0 0 16px #fff6}.tgl.on::after{transform:translateX(20px);background:#000}
/* intro */
#in{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity 1s var(--e),filter 1s,transform 1s var(--e)}
#in.x{opacity:0;filter:blur(14px);transform:scale(1.06);pointer-events:none}
#sg{position:relative;transform-origin:0 0}#sg img,#pen{position:absolute;display:block;user-select:none;-webkit-user-drag:none}#sg img{opacity:0}
#tx{-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--p,0)*1% - 5%),transparent calc(var(--p,0)*1%));mask-image:linear-gradient(90deg,#000 calc(var(--p,0)*1% - 5%),transparent calc(var(--p,0)*1%))}#tx.on{opacity:1}
#pen{width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:radial-gradient(#fff,#fff8 22%,transparent 68%);opacity:0;pointer-events:none;mix-blend-mode:screen}
#ln{clip-path:inset(0 50% 0 50%);transition:clip-path 2s cubic-bezier(.4,0,.2,1),opacity .6s}#ln.on{opacity:1;clip-path:inset(0)}
#ri{transition:opacity .9s var(--e),transform .9s var(--e)}#ri.on{opacity:1}#ri.mv{transition:transform 1.3s cubic-bezier(.65,0,.25,1)}
#rt{clip-path:inset(0 100% 0 0);transition:clip-path 1.3s cubic-bezier(.65,0,.25,1),opacity .6s}#rt.on{opacity:1;clip-path:inset(0)}
.ib.w{width:auto;padding:0 13px;border-radius:99px;font-size:13px}.tgs{font-size:11px;color:#777;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cv svg{width:100%;height:100%}
.mo{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}.mo::-webkit-scrollbar{display:none}
.mo .btn{white-space:nowrap;padding:8px 13px;font-size:13px;border-radius:99px;flex:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

let a=com.map(x=>[sc(x),x]).filter(([v])=>v>0);a=N?a.sort((p,q)=>q[1].ts-p[1].ts):a.sort((p,q)=>q[0]-p[0]||q[1].ts-p[1].ts);
const ru=lang=='ru',tg=[aw.length&&(ru?'автор: ':'artist: ')+aw.join(' '),fw.length&&(ru?'слова: ':'words: ')+fw.join(' '),L&&(ru?'громкие':'loud'),Q&&(ru?'тихие':'quiet'),N&&(ru?'новые':'new')].filter(Boolean);return[a.map(p=>p[1]),tg]}
/* ===== views ===== */
const card=(x,i,an)=>`<div class="cd${an?' st':''}" style="--i:${Math.min(i,10)+3}"><div class="cv">${art(x.code)}</div><div class="m"><div class="n">${esc(x.n)}</div><div class="a">${esc(x.a)}${x.by?' · @'+esc(x.by):''}</div><code>${esc(x.code)}</code>${x.tg?`<div class="tgs">${esc(x.tg)}</div>`:''}</div><div class="bt">${x.pv?`<button class="ib" data-p="${esc(x.id)}">▶</button>`:''}<button class="ib w${x.lk?.includes(sess.login)?' on':''}" data-lk="${esc(x.id)}">${x.lk?.length||0} ♥</button><button class="ib" data-c="${esc(x.code)}">⧉</button>${x.by&&(x.by==sess.login||sess.role=='dev')?`<button class="ib" data-d="${esc(x.id)}">✕</button>`:''}</div></div>`;
const nav=()=>{$('#nv').hidden=!sess;$('#nv').innerHTML=[['cat','tCat'],['up','upl'],['fav','tFav'],['set','tSet']].map(([k,l])=>`<button data-t="${k}" class="${tab==k?'on':''}">${t(l)}</button>`).join('')};
const topbar=()=>`<div class="top st"><div class="logo s">sh1zuho <span>finder</span></div><div class="me"><span>${esc(sess.login)}</span>${sess.role=='dev'?`<span class="bd">${t('dev')}</span>`:''}</div></div>`;
function vHome(){nav();const v={cat:vCat,up:vUp,fav:vFav,set:vSet}[tab]();show(topbar()+v[0],v[1])}
const vCat=()=>[`${srv?'':`<p class="msg">${t('noSrv')}</p>`}<div class="row st" style="--i:1"><input class="q" id="q" placeholder="${t(aiOn?'ask':'search')}" autocomplete="off" value="${esc(qv)}"><button class="btn g ic${aiOn?' on':''}" id="ai">✦</button><button class="btn g ic" id="sy"><span>⟳</span></button></div><div class="mo st" style="--i:2">${[['L','mL'],['Q','mQ'],['N','mN'],['D','mD'],['S','mS']].map(([k,l])=>`<button class="btn g${mood==k?' on':''}" data-md="${k}">${t(l)}</button>`).join('')}<button class="btn g" data-a="rnd">⇄</button></div><div class="chips" id="cp"></div><div class="inf st" style="--i:3" id="inf"></div><div id="ls"></div>`,()=>{list(1);info();load().then(()=>{if(tab=='cat'){list(1);info()}})}];
function list(an){const q=qv.trim();let L,tg=[];if(!q)L=com;else if(!aiOn)L=com.filter(x=>[x.n,x.a,x.code,x.tg,x.by].join(' ').toLowerCase().includes(q.toLowerCase()));else[L,tg]=aiq(q);
if(mood){const re={L:LOUD,Q:QUIET,D:DANCE,S:SAD}[mood];L=mood=='N'?[...L].sort((a,b)=>b.ts-a.ts).slice(0,25):L.filter(x=>re.test(x.n+' '+x.a+' '+(x.tg||'')));tg=[...tg,t('m'+mood)]}
if(srvIds&&q){L=srvIds.map(i=>com[i]).filter(Boolean);tg=[...tg,'AI']}
const cp=$('#cp'),ls=$('#ls');if(!ls)return;cp.innerHTML=tg.map(x=>`<span class="tg">${esc(x)}</span>`).join('');ls.innerHTML=L.length?L.slice(0,80).map((x,i)=>card(x,i,an)).join(''):`<p class="msg">${t('empty')}</p>`}
const info=()=>{const e=$('#inf');if(e)e.textContent=com.length+(last?' · '+new Date(last).toLocaleTimeString():'')};
const vUp=()=>[!srv||!sess.token?`<p class="msg">${t('noSrv')}</p>`:`<div class="win st" style="margin:0"><h2>${t('upl')}</h2><div class="f"><input id="uc" inputmode="numeric" placeholder=" " maxlength="20"><label for="uc">${t('rcd')}</label></div><div class="f"><input id="un" placeholder=" " maxlength="80"><label for="un">${t('ttl')}</label></div><div class="f"><input id="ua" placeholder=" " maxlength="60"><label for="ua">${t('art')}</label></div><div class="msg" id="um"></div><button class="btn" id="up" style="width:100%">${t('send')}</button></div>`,()=>{}];
const vFav=()=>{const L=com.filter(x=>x.lk?.includes(sess.login));return[L.length?L.map((x,i)=>card(x,i,1)).join(''):`<p class="msg">${t('empty')}</p>`,()=>{}]};
const vSet=()=>[`<div class="win st" style="margin-top:0"><h2>${t('sBg')}</h2><div class="lg">${KI.map((k,i)=>`<button class="ch${st.kind==k?' on':''}" data-k="${k}"><b>${i+1}</b>${KN[lang][i]}</button>`).join('')}</div>
<div class="sr"><span>${t('sCnt')}</span><input type="range" id="sn" min="15" max="180" value="${st.n}"></div><div class="sr"><span>${t('sSpd')}</span><input type="range" id="ss" min="3" max="30" value="${st.sp*10}"></div>
<div class="sr"><span>${t('sGlow')}</span><div class="tgl${st.glow?' on':''}" data-s="glow"></div></div><div class="sr"><span>${t('sTouch')}</span><div class="tgl${st.tilt?' on':''}" data-s="tilt"></div></div>
<h2 style="font-size:15px;margin:16px 0 10px">${t('sLang')}</h2><div class="lg">${LN.map(([c,n])=>`<button class="ch${c==lang?' on':''}" data-l="${c}"><b>${c.toUpperCase()}</b>${n}</button>`).join('')}</div>
<div class="f" style="margin-top:14px"><input id="sv" placeholder=" " value="${esc(G('sf_api',''))}" autocapitalize="none" spellcheck="false"><label for="sv">${t('sSrv')}</label></div><button class="btn g" data-a="test" style="width:100%">${t('sTest')}</button><div class="msg" id="sm"></div><button class="btn g" id="lo" style="width:100%">${t('out')}</button></div>`,()=>{}];
/* ===== auth ===== */
function vAuth(){step='';const r=mode=='r';$('#nv').hidden=true;$('#pm').hidden=true;show(`<div class="win st"><div class="logo">sh1zuho <span>finder</span></div><div class="tabs${r?' r':''}" id="tb"><i></i><button data-m="l" class="${r?'':'on'}">${t('login')}</button><button data-m="r" class="${r?'on':''}">${t('reg')}</button></div><div id="fm"><div class="f"><input id="u" placeholder=" " autocomplete="username" autocapitalize="none" spellcheck="false"><label for="u">${t('user')}</label></div><div class="col${r?' o':''}" id="em"><div><div class="f"><input id="e" type="email" placeholder=" " autocomplete="email"><label for="e">${t('mail')}</label></div></div></div><div class="f"><input id="p" type="password" placeholder=" " autocomplete="${r?'new-password':'current-password'}"><label for="p">${t('pass')}</label></div></div><div class="msg" id="ms"></div><button class="btn" id="ok" style="width:100%">${t(r?'reg':'login')}</button><div class="hint">${srv?'':t('local')}</div></div>`)}
const busy=b=>$('#ok')?.classList.toggle('ld',b);
function fail(k){$('#ms').textContent=t(k);const w=$('.win');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}
function enter(u,tok){sess={...u,token:tok};S('sf_sess',sess);tab='cat';vHome()}
const done=j=>enter(j.user,j.token);
async function submit(){$('#ms').textContent='';
if(step=='code'){busy(1);try{done(await jf('/api/verify',{login:pend,code:$('#cd').value.trim()}))}catch{fail('err')}busy(0);return}
const l=$('#u').value.trim().toLowerCase(),p=$('#p').value,r=mode=='r',e=$('#e').value.trim();
if(!l||!p||r&&(!/^[a-z0-9_]{3,20}$/.test(l)||p.length<6||!/^\S+@\S+\.\S+$/.test(e)))return fail('err');
busy(1);try{if(!r){if(srv)done(await jf('/api/login',{login:l,pass:p}));else{const u=users[l];if(!u||u.hash!==await hp(l,p))throw 0;enter({login:l,role:u.role||'user'})}}
else if(srv){const j=await jf('/api/register',{login:l,email:e,pass:p});if(j.sent){step='code';pend=l;$('#fm').innerHTML=`<p class="msg sw">${t('sent')} ${esc(e)}</p><div class="f sw"><input id="cd" inputmode="numeric" maxlength="6" placeholder=" " autocomplete="one-time-code" style="letter-spacing:.5em;font-size:22px"><label for="cd">${t('code')}</label></div>`;$('#ok').textContent=t('confirm');$('#cd').focus()}else done(j)}
else{if(users[l])throw{e:'taken'};users[l]={hash:await hp(l,p),email:e,role:'user'};S('sf_users',users);enter({login:l,role:'user'})}}
catch(x){fail(x&&x.e=='taken'?'taken':'err')}busy(0)}
/* ===== events ===== */
async function cp(b){try{await navigator.clipboard.writeText(b.dataset.c)}catch{const x=document.createElement('textarea');x.value=b.dataset.c;document.body.append(x);x.select();document.execCommand('copy');x.remove()}const o=b.textContent;b.textContent='✓';b.classList.add('on');toast(t('copied'));setTimeout(()=>{b.textContent=o;b.classList.remove('on')},1400)}
const sav=()=>S('sf_st',st);
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.ch,.cd,.ib,#nv button');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,i=document.createElement('span');i.className='rip';i.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.append(i);setTimeout(()=>i.remove(),750)});
document.addEventListener('click',async e=>{const x=e.target.closest('[data-t],[data-p],[data-c],[data-lk],[data-d],[data-k],[data-l],[data-s],[data-m],[data-a],[data-md],#go,#ai,#sy,#up,#lo,#ok,#pp');if(!x)return;const d=x.dataset;
if(d.md){mood=mood==d.md?'':d.md;document.querySelectorAll('[data-md]').forEach(b=>b.classList.toggle('on',b.dataset.md==mood));list(1)}
else if(x.id=='go'){S('sf_langset',1);sess?vHome():vAuth()}
else if(d.a=='rnd'){const L=com.filter(v=>v.pv);if(L.length){cur=null;play(L[Math.random()*L.length|0].id)}}
else if(d.t){tab=d.t;vHome()}else if(d.p)play(d.p);
else if(d.c)cp(x);
else if(d.lk){if(!sess.token)return toast(t('noSrv'));try{await jf('/api/like',{id:d.lk});com=(await jf('/api/tracks')).tracks;vHome()}catch{}}
else if(d.d){try{await jf('/api/del',{id:d.d});await load();vHome()}catch{}}
else if(d.k){st.kind=d.k;sav();document.querySelectorAll('.ch').forEach(c=>c.classList.toggle('on',c==x))}
else if(d.l){lang=d.l;S('sf_lang',lang);document.documentElement.lang=lang;if($('#go')){document.querySelectorAll('.ch').forEach(c=>c.classList.toggle('on',c==x));const p=$('#pk');p.textContent=t('pick');p.classList.remove('sw');void p.offsetWidth;p.classList.add('sw')}else vHome()}
else if(d.s){st[d.s]=st[d.s]?0:1;sav();x.classList.toggle('on')}
else if(d.m){mode=d.m;const r=mode=='r';$('#tb').classList.toggle('r',r);document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b==x));$('#em').classList.toggle('o',r);$('#ok').textContent=t(r?'reg':'login');$('#ms').textContent=''}
else if(d.a=='test'){S('sf_api',$('#sv').value.trim());await probe();$('#sm').textContent=t(srv?'ok':'fail');if(srv&&!sess.token){sess=null;S('sf_sess',null);setTimeout(vAuth,900)}}
else if(x.id=='ai'){aiOn=aiOn?0:1;S('sf_ai',aiOn);srvIds=null;vHome()}
else if(x.id=='sy'){x.classList.add('sp');await load();list(1);info();x.classList.remove('sp')}
else if(x.id=='up'){const b=$('#up'),m=$('#um');b.classList.add('ld');m.textContent=t('chk');try{await jf('/api/upload',{code:$('#uc').value.trim(),n:$('#un').value,a:$('#ua').value});m.textContent=t('done');await load();$('#uc').value=$('#un').value=$('#ua').value=''}catch(e){m.textContent=t(e.e=='bad'?'bad':e.e=='dup'?'dup':'err')}b.classList.remove('ld')}
else if(x.id=='lo'){sess=null;S('sf_sess',null);mode='l';vAuth()}
else if(x.id=='ok')submit();
else if(x.id=='pp')A.src&&(A.paused?A.play():A.pause())});
document.addEventListener('input',e=>{const i=e.target.id;
if(i=='q'){qv=e.target.value;srvIds=null;list(0);clearTimeout(ait);if(aiOn&&srv&&qv.trim().length>3)ait=setTimeout(async()=>{try{const j=await jf('/api/ai',{q:qv,list:com.slice(0,200).map((x,i)=>[i,x.a,x.n,x.tg||''])});if(j.ids?.length){srvIds=j.ids;list(1)}}catch{}},700)}
else if(i=='sn'){st.n=+e.target.value;seed();sav()}else if(i=='ss'){st.sp=e.target.value/10;sav()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.closest('#fm'))$('#ok').click()});
$('#pl').addEventListener('click',e=>{if(e.target.closest('#pp')||!A.duration)return;const r=$('#pl').getBoundingClientRect();A.currentTime=(e.clientX-r.left)/r.width*A.duration});
const rf=()=>{if(!document.hidden&&tab=='cat')load().then(()=>{list(0);info()})};document.addEventListener('visibilitychange',rf);setInterval(rf,6e4);
const vLangPick=()=>show(`<div class="win st"><div class="logo">sh1zuho <span>finder</span></div><h2 id="pk" class="sw">${t('pick')}</h2><div class="lg">${LN.map(([c,n],i)=>`<button class="ch st${c==lang?' on':''}" style="--i:${i+2}" data-l="${c}"><b>${c.toUpperCase()}</b>${n}</button>`).join('')}</div><button class="btn st" style="--i:11;width:100%;margin-top:18px" id="go">OK</button></div>`);
(async()=>{rs();frame();document.documentElement.lang=lang;await Promise.all([probe(),intro()]);G('sf_langset',0)?(sess?vHome():vAuth()):vLangPick()})();
</script></body></html>
